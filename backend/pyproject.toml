[project]
name = "invoice-agent"
version = "0.1.0"
description = "Evidence-backed invoice intake and review API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.18,<1",
  "pypdf>=5,<7",
  "pypdfium2>=4.30,<6",
  "Pillow>=11,<13",
  "pillow-heif>=0.20,<2",
  "pytesseract>=0.3.13,<1",
  "openpyxl>=3.1,<4",
  "langchain>=0.3,<2",
  "langchain-openrouter>=0.1,<2",
  "defusedxml>=0.7,<1",
  "python-magic>=0.4,<1",
  "cryptography>=44,<47",
  "Authlib>=1.4,<2",
  "aiosqlite>=0.20,<1",
  "rapidocr-onnxruntime>=1.3,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agent"]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "reportlab>=4.2,<5",
  "ruff>=0.9,<1",
]

[tool.fastapi]
entrypoint = "invoice_agent.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
